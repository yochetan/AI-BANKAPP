name: CD - Deploy & DAST

on:
  workflow_call:

permissions:
  contents: read
  packages: read   # Required to pull the image from GHCR

jobs:

  # ============================================================
  # GATE 8: DEPLOY TO KIND
  # ============================================================
  deploy:
    name: Deploy to kind
    # Runs on your own machine, next to the kind cluster.
    # Repo/org settings -> Actions -> Runners -> New self-hosted runner
    runs-on: self-hosted
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify kind cluster is reachable
        run: |
          kubectl config current-context
          kind get clusters | grep -q "^bankapp-cluster$" || \
            (echo "::error::kind cluster 'bankapp-cluster' not found" && exit 1)

      - name: Ensure namespace exists
        run: |
          kubectl create namespace bankapp --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/Update GHCR pull secret
        # bankapp-deployment.yml references this under imagePullSecrets
        # (skip this step if you make the GHCR package public instead)
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace=bankapp \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -n bankapp -f k8s/service.yml
          kubectl apply -n bankapp -f k8s/bankapp-deployment.yml

      - name: Set Image and Roll Out
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bankapp:${{ github.sha }}
        run: |
          kubectl set image deployment/bankapp-deployment bankapp=$IMAGE -n bankapp
          kubectl rollout status deployment/bankapp-deployment -n bankapp --timeout=120s

      - name: Smoke Check
        run: |
          sleep 5
          curl -sf http://localhost:30080 -o /dev/null || \
            (echo "::error::App did not respond on port 30080 after deploy" && exit 1)

  # ============================================================
  # GATE 9: DAST - Dynamic Application Security Testing
  # ============================================================
  dast:
    name: DAST - OWASP ZAP Baseline Scan
    runs-on: self-hosted
    needs: deploy
    steps:
      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true  # Workaround for ZAP's internal artifact upload bug
        with:
          target: 'http://localhost:30080'
          artifact_name: zapreport
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html