name: CD - Deploy & DAST

on:
  workflow_call:

permissions:
  contents: read
  packages: read   # Required to pull the image from GHCR

jobs:

  # ============================================================
  # GATE 8 + 9: DEPLOY TO KIND, THEN DAST
  # Merged into one job — ubuntu-latest runners are ephemeral,
  # so the kind cluster from "deploy" won't exist in a separate job.
  # ============================================================
  deploy-and-dast:
    name: Deploy to kind & DAST
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Create kind cluster
        uses: helm/kind-action@v1
        with:
          cluster_name: ai-bankapp-cluster
          config: setup-k8s/kind-config.yml

      - name: Verify kind cluster is reachable
        run: |
          kubectl config current-context
          kind get clusters | grep -q "^ai-bankapp-cluster$" || \
            (echo "::error::kind cluster 'ai-bankapp-cluster' not found" && exit 1)

      - name: Ensure namespace exists
        run: |
          kubectl create namespace bankapp --dry-run=client -o yaml | kubectl apply -f -

      - name: Create/Update GHCR pull secret
        # bankapp-deployment.yml references this under imagePullSecrets
        # (skip this step if you make the GHCR package public instead)
        run: |
          kubectl create secret docker-registry ghcr-pull-secret \
            --namespace=bankapp \
            --docker-server=ghcr.io \
            --docker-username=${{ github.actor }} \
            --docker-password=${{ secrets.GITHUB_TOKEN }} \
            --dry-run=client -o yaml | kubectl apply -f -

      - name: Apply Config, Secrets and PVs/PVCs
        run: |
          kubectl apply -n bankapp -f k8s/configMap.yml
          kubectl apply -n bankapp -f k8s/secrets.yml
          kubectl apply -f k8s/persistentVolume.yml
          kubectl apply -n bankapp -f k8s/pvc.yml

      - name: Apply MySQL and Ollama, then wait for them
        run: |
          kubectl apply -n bankapp -f k8s/service.yml
          kubectl apply -n bankapp -f k8s/mysql-deployment.yml
          kubectl apply -n bankapp -f k8s/ollama-deployment.yml
          kubectl rollout status deployment/mysql-deployment -n bankapp --timeout=120s
          kubectl rollout status deployment/ollama-deployment -n bankapp --timeout=300s

      - name: Apply Kubernetes Manifests
        run: |
          kubectl apply -n bankapp -f k8s/bankapp-deployment.yml

      - name: Set Image and Roll Out
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/bankapp:${{ github.sha }}
        run: |
          kubectl set image deployment/bankapp-deployment bankapp=$IMAGE -n bankapp
          kubectl rollout status deployment/bankapp-deployment -n bankapp --timeout=120s

      - name: Debug on failure
        if: failure()
        run: |
          echo "===== PVs ====="
          kubectl get pv
          echo "===== PVCs ====="
          kubectl get pvc -n bankapp
          echo "===== ALL PODS ====="
          kubectl get pods -n bankapp -o wide
          echo "===== DESCRIBE ALL PODS ====="
          kubectl describe pods -n bankapp
          echo "===== CONTAINER LOGS (all pods) ====="
          for pod in $(kubectl get pods -n bankapp -o jsonpath='{.items[*].metadata.name}'); do
            echo "--- $pod ---"
            kubectl logs -n bankapp "$pod" --all-containers --tail=100 || true
          done
          echo "===== SERVICES & ENDPOINTS ====="
          kubectl get svc,endpoints -n bankapp
          echo "===== NAMESPACE EVENTS ====="
          kubectl get events -n bankapp --sort-by='.lastTimestamp'

      - name: Smoke Check
        run: |
          sleep 5
          curl -sf http://localhost:8080 -o /dev/null || \
            (echo "::error::App did not respond on port 8080 after deploy" && exit 1)

      - name: Run OWASP ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        continue-on-error: true  # Workaround for ZAP's internal artifact upload bug
        with:
          target: 'http://localhost:8080'
          artifact_name: zapreport
          fail_action: false
          allow_issue_writing: false

      - name: Upload ZAP Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-dast-report
          path: report_html.html
