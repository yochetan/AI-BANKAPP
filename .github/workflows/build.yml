name: Build - Container Build & Push

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # ============================================================
  # GATE 5: BUILD
  # ============================================================
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ============================================================
  # GATE 6: CONTAINER IMAGE SCAN - Trivy
  # ============================================================
  image_scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image (for scanning)
        run: docker build --pull -t bankapp:scan-${{ github.sha }} .

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bankapp:scan-${{ github.sha }}
          format: 'table'
          exit-code: '1'         # Enforce: fail pipeline on CRITICAL/HIGH findings
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: trivy-report.txt
          trivy-config: trivy.yaml
      - name: Show Trivy Results
        if: always()
        run: |
          cat trivy-report.txt

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-report.txt

  # ============================================================
  # GATE 7: LOAD IMAGE INTO KIND CLUSTER
  # ============================================================
  load_to_kind:
    name: Load Image into kind
    runs-on: ubuntu-latest
    needs: image_scan
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Final Image
        run: docker build --pull -t bankapp:${{ github.sha }} .

      - name: Install kind
        uses: helm/kind-action@v1.10.0
        with:
          install_only: true

      # If the kind cluster is created elsewhere (e.g. a persistent
      # self-hosted runner), replace this step with a check that the
      # cluster named below already exists instead of creating a new one.
      - name: Create kind cluster
        run: kind create cluster --name bankapp-cluster

      - name: Load Image into kind
        run: kind load docker-image bankapp:${{ github.sha }} --name bankapp-cluster

      - name: (Optional) Also tag as latest for local convenience
        run: |
          docker tag bankapp:${{ github.sha }} bankapp:latest
          kind load docker-image bankapp:latest --name bankapp-cluster