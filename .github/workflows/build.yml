name: Build - Container Build & Push

on:
  workflow_call:

permissions:
  contents: read

jobs:

  # ============================================================
  # GATE 5: BUILD
  # ============================================================
  build:
    name: Build & Package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Build with Maven
        run: mvn clean package -DskipTests

      - name: Upload Build Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/*.jar

  # ============================================================
  # GATE 6: CONTAINER IMAGE SCAN - Trivy
  # ============================================================
  image_scan:
    name: Container Scan - Trivy
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Build Docker Image (for scanning)
        run: docker build --pull -t bankapp:scan-${{ github.sha }} .

      - name: Cache Trivy DB
        uses: actions/cache@v4
        with:
          path: ~/.cache/trivy
          key: trivy-db-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            trivy-db-${{ runner.os }}-

      - name: Run Trivy Image Scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: bankapp:scan-${{ github.sha }}
          format: 'table'
          exit-code: '1'         # Enforce: fail pipeline on CRITICAL/HIGH findings
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
          output: trivy-report.txt
          trivy-config: trivy.yaml
      - name: Show Trivy Results
        if: always()
        run: |
          cat trivy-report.txt

      - name: Upload Trivy Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: trivy-scan-report
          path: trivy-report.txt

  # ============================================================
  # GATE 7: PUSH IMAGE TO GHCR
  # cd.yml deploys ghcr.io/<owner>/bankapp:<sha> — that image has to
  # actually exist in the registry before cd.yml runs. Each reusable
  # workflow job runs on its own separate, ephemeral VM, so loading
  # an image into a locally-created kind cluster here does NOT make
  # it available to cd.yml's kind cluster.
  # ============================================================
  push_to_ghcr:
    name: Push Image to GHCR
    runs-on: ubuntu-latest
    needs: image_scan
    permissions:
      contents: read
      packages: write   # Required to push to GHCR
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build Final Image
        run: docker build --pull -t ghcr.io/${{ github.repository_owner }}/bankapp:${{ github.sha }} .

      - name: Push Image to GHCR
        run: docker push ghcr.io/${{ github.repository_owner }}/bankapp:${{ github.sha }}